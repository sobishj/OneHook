<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <circle cx="640" cy="110" r="90" fill="url(#moonGlow)"/>
  <circle cx="640" cy="110" r="46" fill="#fde68a"/>

  <g fill="#fde047">
    <circle cx="80" cy="70" r="3"/>
    <circle cx="150" cy="130" r="2"/>
    <circle cx="230" cy="60" r="2.5"/>
    <circle cx="310" cy="150" r="3"/>
    <circle cx="60" cy="220" r="2"/>
    <circle cx="400" cy="90" r="2.5"/>
    <circle cx="470" cy="180" r="2"/>
    <circle cx="520" cy="50" r="3"/>
    <circle cx="720" cy="250" r="2.5"/>
    <circle cx="760" cy="150" r="2"/>
    <circle cx="180" cy="260" r="2"/>
    <circle cx="360" cy="220" r="2.5"/>
  </g>

  <!-- Big friendly star mascot -->
  <g transform="translate(400,300)">
    <path d="M0,-70 L18,-22 L68,-22 L28,8 L44,58 L0,26 L-44,58 L-28,8 L-68,-22 L-18,-22 Z"
          fill="#fbbf24" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-16" cy="-8" r="6" fill="#78350f"/>
    <circle cx="16" cy="-8" r="6" fill="#78350f"/>
    <path d="M-16,14 Q0,26 16,14" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-26" cy="4" r="7" fill="#fca5a5" opacity="0.6"/>
    <circle cx="26" cy="4" r="7" fill="#fca5a5" opacity="0.6"/>
  </g>

  <!-- Star jar -->
  <g transform="translate(190,330)">
    <path d="M-45,-70 L45,-70 L38,60 Q38,80 0,80 Q-38,80 -38,60 Z" fill="#e0f2fe" opacity="0.35" stroke="#f8fafc" stroke-width="3"/>
    <rect x="-50" y="-84" width="100" height="18" rx="6" fill="#fbbf24"/>
    <circle cx="-14" cy="0" r="7" fill="#fde047"/>
    <circle cx="10" cy="20" r="9" fill="#fde047"/>
    <circle cx="-6" cy="34" r="6" fill="#fde047"/>
    <circle cx="16" cy="-10" r="6" fill="#fde047"/>
  </g>

  <!-- Scratch card hint -->
  <g transform="translate(610,330)">
    <rect x="-55" y="-40" width="110" height="80" rx="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
    <path d="M-40,-20 L40,20 M-40,20 L40,-20" stroke="#fef3c7" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-30" cy="-30" r="3" fill="#fff"/>
    <circle cx="35" cy="28" r="3" fill="#fff"/>
  </g>
</svg>
