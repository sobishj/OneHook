<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Controller Body -->
  <g transform="translate(256, 260)">
    <!-- Controller Base Shape -->
    <path d="M -150 -60 C -170 -60, -190 -40, -190 0 C -190 60, -160 140, -110 140 C -80 140, -60 100, -30 90 C -10 85, 10 85, 30 90 C 60 100, 80 140, 110 140 C 160 140, 190 60, 190 0 C 190 -40, 170 -60, 150 -60 Z" fill="url(#ctrlGrad)" stroke="#38bdf8" stroke-width="5" filter="url(#glow)"/>

    <!-- Left D-Pad -->
    <g transform="translate(-100, 10)">
      <!-- Horizontal Bar -->
      <rect x="-35" y="-12" width="70" height="24" rx="6" fill="#38bdf8"/>
      <!-- Vertical Bar -->
      <rect x="-12" y="-35" width="24" height="70" rx="6" fill="#38bdf8"/>
      <!-- Center Circle Accent -->
      <circle cx="0" cy="0" r="5" fill="#0284c7"/>
    </g>

    <!-- Right Action Buttons (Diamond layout) -->
    <g transform="translate(100, 10)">
      <!-- Top Button (Y / Yellow) -->
      <circle cx="0" cy="-26" r="11" fill="#fbbf24"/>
      <!-- Bottom Button (A / Green) -->
      <circle cx="0" cy="26" r="11" fill="#34d399"/>
      <!-- Left Button (X / Blue) -->
      <circle cx="-26" cy="0" r="11" fill="#38bdf8"/>
      <!-- Right Button (B / Red) -->
      <circle cx="26" cy="0" r="11" fill="#fb7185"/>
    </g>

    <!-- Center SprintGames Badge / Gem -->
    <polygon points="0,-24 16,0 0,24 -16,0" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
